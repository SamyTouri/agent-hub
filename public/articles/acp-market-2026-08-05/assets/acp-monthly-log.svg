<text class="label" x="387.5" y="94.5" text-anchor="middle" fill="#d9564a" style="fill:#d9564a">$1.16m</text>
<text class="label" x="498.0" y="142.0" text-anchor="middle" fill="#d9564a" style="fill:#d9564a">$1.04m</text>
<text class="label" x="701.0" y="435.9" text-anchor="middle" fill="#16877c" style="fill:#16877c">$778 floor</text>
<text class="label" x="906.0" y="380.4" text-anchor="middle" fill="#16877c" style="fill:#16877c">$1,082</text>
<text class="small" x="908" y="492" text-anchor="end">Source: raw Base USDC Transfer logs · values rounded to nearest dollar</text>
</svg>
