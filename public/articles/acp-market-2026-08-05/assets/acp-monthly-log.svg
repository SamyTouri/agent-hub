<circle cx="600.5" cy="256.9" r="6" fill="#fbfaf7" stroke="#2867a8" stroke-width="4"/>
<text class="axis" x="600.5" y="456" text-anchor="middle">Apr</text>
<circle cx="703.0" cy="411.9" r="6" fill="#fbfaf7" stroke="#16877c" stroke-width="4"/>
<text class="axis" x="703.0" y="456" text-anchor="middle">May</text>
<circle cx="805.5" cy="410.8" r="6" fill="#fbfaf7" stroke="#16877c" stroke-width="4"/>
<text class="axis" x="805.5" y="456" text-anchor="middle">Jun</text>
<circle cx="908.0" cy="398.4" r="6" fill="#fbfaf7" stroke="#16877c" stroke-width="4"/>
